name: Backline

options:
  bundleIdPrefix: net.ekkoh
  minimumXcodeGenVersion: "2.46.0"
  xcodeVersion: "26.3"
  projectFormat: xcode16_0
  defaultSourceDirectoryType: syncedFolder
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${BACKLINE_DEVELOPMENT_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Backline:
    type: application
    platform: macOS
    sources:
      - Backline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Backline needs audio input to run your guitar through the plugin."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Chris Simmons. MIT License."
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Backline/Backline.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.device.audio-input: true
    scheme:
      testTargets:
        - BacklineTests
    postCompileScripts:
      - name: swift-format lint
        script: xcrun swift-format lint --recursive "$SRCROOT/Backline" "$SRCROOT/BacklineTests"
        basedOnDependencyAnalysis: false

  BacklineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BacklineTests
    dependencies:
      - target: Backline
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
